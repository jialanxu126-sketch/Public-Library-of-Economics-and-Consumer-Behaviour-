<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        {{ page.title }} · {{ site.title }}
    </title>

    <style>

        :root {

            --background: #f7f6f2;
            --surface: #ffffff;

            --text: #292925;
            --muted: #77766f;
            --border: #deddd6;

            --accent: #596b61;

            --serif: Georgia, "Times New Roman", serif;
            --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        }


        * {
            box-sizing: border-box;
        }


        body {

            margin: 0;

            background: var(--background);

            color: var(--text);

            font-family: var(--sans);

            line-height: 1.8;
        }


        a {
            color: inherit;
            text-decoration: none;
        }


        .article-wrapper {

            max-width: 850px;

            margin: 0 auto;

            padding: 70px 30px 100px;
        }


        .back {

            font-size: 12px;

            color: var(--muted);

            margin-bottom: 80px;

            display: inline-block;
        }


        .category {

            font-size: 11px;

            text-transform: uppercase;

            letter-spacing: 0.15em;

            color: var(--accent);

            margin-bottom: 18px;
        }


        h1 {

            font-family: var(--serif);

            font-size: clamp(42px, 6vw, 68px);

            font-weight: 400;

            line-height: 1.08;

            letter-spacing: -0.035em;

            margin: 0 0 25px;
        }


        .description {

            font-size: 18px;

            color: var(--muted);

            line-height: 1.7;

            margin-bottom: 25px;
        }


        .date {

            font-size: 11px;

            color: #999890;

            padding-bottom: 35px;

            border-bottom: 1px solid var(--border);
        }


        .article {

            margin-top: 60px;
        }


        .article h2 {

            font-family: var(--serif);

            font-size: 30px;

            font-weight: 400;

            margin-top: 65px;

            margin-bottom: 20px;
        }


        .article h3 {

            font-family: var(--serif);

            font-size: 23px;

            font-weight: 400;

            margin-top: 45px;
        }


        .article p {

            font-size: 16px;

            margin: 0 0 23px;
        }


        .article ul,
        .article ol {

            padding-left: 25px;

            margin-bottom: 25px;
        }


        .article li {

            margin-bottom: 8px;
        }


        .article blockquote {

            margin: 35px 0;

            padding: 20px 25px;

            border-left: 2px solid var(--accent);

            background: var(--surface);

            color: var(--muted);
        }


        .sources {

            margin-top: 80px;

            padding-top: 30px;

            border-top: 1px solid var(--border);
        }


        .sources h2 {

            font-family: var(--serif);

            font-weight: 400;

            font-size: 28px;
        }


        .sources p {

            font-size: 14px;

            color: var(--muted);
        }


        @media (max-width: 650px) {

            .article-wrapper {

                padding: 40px 22px 70px;
            }


            .back {

                margin-bottom: 55px;
            }


            h1 {

                font-size: 43px;
            }


            .description {

                font-size: 16px;
            }


            .article p {

                font-size: 15px;
            }

        }

    </style>

</head>


<body>


    <main class="article-wrapper">


        <a
            href="{{ '/' | relative_url }}"
            class="back"
        >
            ← Back to the library
        </a>


        <header>

            {% if page.category %}

                <div class="category">
                    {{ page.category }}
                </div>

            {% endif %}


            <h1>
                {{ page.title }}
            </h1>


            {% if page.description %}

                <div class="description">
                    {{ page.description }}
                </div>

            {% endif %}


            {% if page.date %}

                <div class="date">

                    Published
                    {{ page.date | date: "%d %B %Y" }}

                </div>

            {% endif %}

        </header>


        <article class="article">

            {{ content }}

        </article>


    </main>


</body>

</html>
